name: Import beam wall mount v1 archive (one time)
on:
  push:
    branches: [v1]
    paths:
      - .github/workflows/import-beam-wall-mount.yml
permissions:
  contents: write
jobs:
  import-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1
          fetch-depth: 1
          persist-credentials: true
      - name: Download and verify uploaded source archive
        shell: bash
        env:
          IMPORT_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-a038-8212-9e29-71717227044d/raw?se=2026-11-19T21%3A52%3A07Z&sp=r&sv=2026-06-06&sr=b&scid=1d015e16-c55b-5e6b-ae29-18a93da7d24a&skoid=9b9c502c-68d7-438f-bea0-600feb684c90&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-19T19%3A08%3A13Z&ske=2026-11-20T19%3A08%3A13Z&sks=b&skv=2026-06-06&sig=zNYrUOvtDCaLMhHiTn/Vo9vS%2BOJ/0BRKNPVvralRFok%3D'
          EXPECTED_SHA256: '9deccf61eb73c90e062890550b0e39def13248460ed9caa283d535a7030cf4cb'
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 "$IMPORT_URL" --output /tmp/beam-wall-mount-v1.zip
          echo "$EXPECTED_SHA256  /tmp/beam-wall-mount-v1.zip" | sha256sum --check
      - name: Extract project safely without overwriting existing repository files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, shutil, stat
          root = Path.cwd().resolve()
          archive = Path('/tmp/beam-wall-mount-v1.zip')
          n = 0
          with zipfile.ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC mismatch: '+bad)
              for info in z.infolist():
                  parts = Path(info.filename).parts
                  if not parts or parts[0] != 'beam_wall_mount_v1':
                      raise ValueError('Unexpected ZIP root '+info.filename)
                  if info.is_dir() or len(parts) == 1:
                      continue
                  relative = Path(*parts[1:])
                  if relative.is_absolute() or '..' in relative.parts:
                      raise ValueError('Unsafe archive path '+info.filename)
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise ValueError('Unexpected symlink '+info.filename)
                  target = (root / relative).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Archive path outside repository '+info.filename)
                  if target.exists():
                      raise FileExistsError('Will not overwrite existing repository file '+str(relative))
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open('wb') as dst:
                      shutil.copyfileobj(src, dst)
                  n += 1
          print('Imported',n,'ZIP files; preserved all existing repository files')
          PY
          python3 scripts/package_project.py --verify
      - name: Commit imported archive to v1 and remove the one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/import-beam-wall-mount.yml
          git commit -m "Import complete beam wall mount v1 project from verified ZIP"
          git push origin HEAD:v1
